[build]
  publish = "netlify-static"
  functions = "netlify-functions"
  command = "echo 'No build needed - using pre-built files'"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
